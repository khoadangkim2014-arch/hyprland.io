<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Quản Lý Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center font-sans p-4">

    <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl max-w-lg w-full border border-slate-700">
        <h1 class="text-2xl font-bold text-center text-blue-400 mb-2 uppercase tracking-wider">Hệ Thống Quản Lý Key</h1>
        <p class="text-slate-400 text-sm text-center mb-6">Thêm hoặc xóa Key từ xa. Dữ liệu sẽ tự đồng bộ thẳng lên GitHub.</p>

        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700 mb-6">
            <h3 class="text-sm font-bold text-slate-300 mb-3 uppercase">⚙️ Cấu hình GitHub API</h3>
            <div class="space-y-3">
                <input type="password" id="githubToken" placeholder="Nhập GitHub Personal Access Token (PAT)..." 
                       class="w-full px-4 py-2 rounded-xl bg-slate-800 border border-slate-600 text-sm text-white focus:outline-none focus:border-blue-500 font-mono">
                <input type="text" id="githubRepo" placeholder="Đường dẫn Repo (Ví dụ: ten-cua-may/ten-repo)" 
                       class="w-full px-4 py-2 rounded-xl bg-slate-800 border border-slate-600 text-sm text-white focus:outline-none focus:border-blue-500 font-mono">
            </div>
            <button onclick="loadKeysFromGitHub()" class="w-full mt-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl transition duration-200">
                🔄 TẢI DANH SÁCH KEY HIỆN TẠI
            </button>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-semibold text-slate-300 mb-2">Thêm Key mới:</label>
            <div class="flex gap-2">
                <input type="text" id="newKeyInput" placeholder="Ví dụ: KEY_NEW_2026" 
                       class="flex-1 px-4 py-3 rounded-xl bg-slate-900 border border-slate-600 text-white focus:outline-none focus:border-emerald-500 font-mono text-center">
                <button onclick="addNewKey()" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20">
                    THÊM
                </button>
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-300 mb-2">Danh sách Key đang hoạt động:</label>
            <div id="keyList" class="bg-slate-900 max-h-48 overflow-y-auto rounded-2xl border border-slate-700 p-3 space-y-2 font-mono text-sm">
                <p class="text-slate-500 text-center py-4">Bấm nút "Tải danh sách" ở trên để xem Key...</p>
            </div>
        </div>
    </div>

    <script>
        let currentSha = ""; // Biến lưu mã SHA của file trên GitHub để cập nhật
        let localKeysList = []; // Mảng lưu trữ danh sách key tạm thời

        // 1. Hàm lấy danh sách Key từ GitHub về hiển thị lên giao diện Web
        async function loadKeysFromGitHub() {
            const token = document.getElementById('githubToken').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();

            if (!token || !repo) {
                alert("Mày phải nhập đủ Token và tên Repo GitHub đã nha!");
                return;
            }

            const url = `https://api.github.com/repos/${repo}/contents/keys.txt`;

            try {
                const response = await fetch(url, {
                    headers: { "Authorization": `token ${token}` }
                });

                if (response.status === 200) {
                    const data = await response.json();
                    currentSha = data.sha; // Lưu lại mã SHA dùng cho lúc ghi đè file
                    
                    // Giải mã chuỗi Base64 từ GitHub trả về thành chữ thường
                    const content = atob(data.content);
                    localKeysList = content.split('\n').map(k => k.trim()).filter(k => k !== "");
                    
                    renderKeyList();
                } else if (response.status === 404) {
                    // Nếu chưa có file keys.txt thì coi như danh sách rỗng
                    localKeysList = [];
                    currentSha = "";
                    renderKeyList();
                } else {
                    alert("Lỗi kết nối GitHub! Check lại thông tin cấu hình xem đúng chưa.");
                }
            } catch (error) {
                alert("Lỗi hệ thống: " + error);
            }
        }

        // 2. Hàm vẽ danh sách Key ra màn hình kèm nút Xóa
        function renderKeyList() {
            const container = document.getElementById('keyList');
            container.innerHTML = "";

            if (localKeysList.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-4">Trống trơn, chưa có Key nào!</p>`;
                return;
            }

            localKeysList.forEach((key, index) => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-slate-800 px-4 py-2 rounded-xl border border-slate-700";
                item.innerHTML = `
                    <span class="text-yellow-400 font-bold">${key}</span>
                    <button onclick="deleteKey(${index})" class="text-xs bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded-lg transition">
                        Xóa
                    </button>
                `;
                container.appendChild(item);
            });
        }

        // 3. Hàm Thêm Key Mới vào mảng và đẩy lên GitHub
        async function addNewKey() {
            const newKey = document.getElementById('newKeyInput').value.trim();
            if (!newKey) {
                alert("Mày chưa gõ chữ gì vào ô thêm Key kìa!");
                return;
            }

            if (localKeysList.includes(newKey)) {
                alert("Key này đã có sẵn trong danh sách rồi mày ơi!");
                return;
            }

            localKeysList.push(newKey); // Thêm vào mảng tạm thời
            document.getElementById('newKeyInput').value = ""; // Xóa ô nhập liệu
            
            await syncWithGitHub("Đã thêm Key mới");
        }

        // 4. Hàm Xóa Key khỏi mảng và đẩy lên GitHub
        async function deleteKey(index) {
            if (confirm(`Mày chắc chắn muốn xóa Key "${localKeysList[index]}" không?`)) {
                localKeysList.splice(index, 1); // Xóa khỏi mảng tạm thời
                await syncWithGitHub("Đã xóa Key");
            }
        }

        // 5. Hàm đồng bộ (Ghi đè file dữ liệu mới) lên GitHub
        async function syncWithGitHub(commitMessage) {
            const token = document.getElementById('githubToken').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const url = `https://api.github.com/repos/${repo}/contents/keys.txt`;

            // Gộp mảng thành chuỗi văn bản, mỗi key một dòng
            const updatedContent = localKeysList.join('\n');
            // Mã hóa chuỗi thành dạng Base64 theo chuẩn quy định của GitHub API
            const base64Content = btoa(unescape(encodeURIComponent(updatedContent)));

            const bodyData = {
                message: commitMessage,
                content: base64Content
            };

            // Nếu file đã có sẵn trên GitHub thì bắt buộc phải gửi kèm mã SHA cũ để ghi đè
            if (currentSha) {
                bodyData.sha = currentSha;
            }

            try {
                const response = await fetch(url, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(bodyData)
                });

                if (response.status === 200 || response.status === 201) {
                    const data = await response.json();
                    currentSha = data.content.sha; // Cập nhật lại mã SHA mới
                    renderKeyList();
                    alert("🎉 Đồng bộ dữ liệu lên GitHub thành công mỹ mãn!");
                } else {
                    alert("Gặp lỗi khi đồng bộ lên GitHub rồi mày ơi!");
                }
            } catch (error) {
                alert("Lỗi đồng bộ: " + error);
            }
        }
    </script>
</body>
</html>
